{% extends "base.html" %}
{% block content %}

<style>

    .container {
        background: white;
        padding: 24px;
        border-radius: 16px;
        width: 520px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        margin-bottom: 16px;
    }

    .display {
        border: 2px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        font-size: 44px;
        text-align: center;
        margin-bottom: 16px;
        font-variant-numeric: tabular-nums;
    }

    .controls {
        display: flex;
        gap: 12px;
    }

    button {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        position: relative;
        box-sizing: border-box;
        min-height: 52px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-text {
        display: flex;
        align-items: center;
        line-height: 1;
    }
    
    .btn-placeholder {
        visibility: hidden;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
    }

    .start {
        background: #4ca34f;
        color: white;
    }

    .stop {
        background: #dc2626;
        color: white;
    }

    .reset {
        background: #e5e7eb;
    }
</style>

<div class="container">
    <h1>Stoppuhr</h1>

    <div class="display" id="time">00:00.000</div>

    <div class="controls">
        <button id="toggleBtn" class="start" onclick="toggleStopwatch()">
            <span class="btn-text">▶ Start</span>
            <span class="btn-placeholder" aria-hidden="true">■ Stopp</span>
        </button>
        <button class="reset" onclick="resetStopwatch()">↺ Reset</button>
    </div>
</div>

<script>
    const timeEl = document.getElementById("time");
    const toggleBtn = document.getElementById("toggleBtn");
    const btnText = toggleBtn.querySelector(".btn-text");

    let running = false;           // Is the stopwatch running locally
    let baseSeconds = 0;           // Time confirmed by the server (seconds)
    let startTimestamp = null;     // performance.now() when started
    let intervalId = null;

    // --- Format time: seconds → MM:SS.mmm ---
    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);
        return (
            String(minutes).padStart(2, "0") + ":" +
            String(sec).padStart(2, "0") + "." +
            String(ms).padStart(3, "0")
        );
    }

    // --- Update display smoothly using local time ---
    function updateStopwatchDisplay() {
        const elapsed = running
            ? baseSeconds + (performance.now() - startTimestamp) / 1000
            : baseSeconds;

        timeEl.textContent = formatTime(elapsed);
    }

    // --- Start / Stop stopwatch ---
    async function toggleStopwatch() {
        try {
            // Tell server to toggle stopwatch state
            await fetch("/stopwatch/toggle", { method: "POST" });

            if (!running) {
                // ▶ START (local smooth run)
                startTimestamp = performance.now();
                running = true;

                btnText.textContent = "■ Stopp";
                toggleBtn.classList.remove("start");
                toggleBtn.classList.add("stop");

                intervalId = setInterval(updateStopwatchDisplay, 50);
            } else {
                // ■ STOP (jump to server value)
                clearInterval(intervalId);
                running = false;

                // Fetch final time from server → one clean jump
                const res = await fetch("/get_state");
                const state = await res.json();
                baseSeconds = (state.elapsed_ms || 0) / 1000;

                btnText.textContent = "▶ Start";
                toggleBtn.classList.remove("stop");
                toggleBtn.classList.add("start");

                updateStopwatchDisplay();
            }
        } catch (err) {
            console.error("Error toggling stopwatch:", err);
        }
    }

    // --- Reset stopwatch ---
    async function resetStopwatch() {
        try {
            await fetch("/stopwatch/reset", { method: "POST" });
            clearInterval(intervalId);

            running = false;
            baseSeconds = 0;
            startTimestamp = null;

            timeEl.textContent = "00:00.000";

            btnText.textContent = "▶ Start";
            toggleBtn.classList.remove("stop");
            toggleBtn.classList.add("start");
        } catch (err) {
            console.error("Error resetting stopwatch:", err);
        }
    }

    // --- Initial sync from server on page load ---
    async function syncFromServer() {
        try {
            const res = await fetch("/get_state");
            const state = await res.json();

            baseSeconds = (state.elapsed_ms || 0) / 1000;

            if (state.stopwatch_running && state.last_start_ts) {
                const elapsed = Date.now() / 1000 - state.last_start_ts;
                baseSeconds += elapsed;

                startTimestamp = performance.now();
                running = true;

                btnText.textContent = "■ Stopp";
                toggleBtn.classList.remove("start");
                toggleBtn.classList.add("stop");

                intervalId = setInterval(updateStopwatchDisplay, 50);
            }

            updateStopwatchDisplay();
        } catch (err) {
            console.error("Error syncing stopwatch:", err);
        }
    }

    // --- Run initial sync ---
    window.addEventListener("DOMContentLoaded", syncFromServer);
</script>

{% endblock %}
