{% extends "base.html" %}
{% block content %}

<style>

    .container {
        background: white;
        padding: 16px 24px;
        border-radius: 16px;
        width: 520px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 15px;
        padding-top: 20px; 
    }

    .team {
        margin-bottom: 12px;
    }

    .team-name-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .team-name-row input[type="text"] {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border-radius: 12px;
        border: 2px solid #ddd;
    }

    .team-name-row input[type="color"] {
        width: 56px;
        height: 48px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
    }

    .score-row {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .score-display {
        flex: 1;
        border: 2px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        font-size: 44px;
        text-align: center;
        font-variant-numeric: tabular-nums;
    }

    button {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        border: none;
        font-size: 26px;
        cursor: pointer;
    }

    .minus {
        background: #dc2626;
        color: white;
    }

    .plus {
        background: #4ca34f;
        color: white;
    }

        .game-time {
        text-align: center;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 16px;
    }

    .controls button {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        position: relative;
        box-sizing: border-box;
        min-height: 52px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-text {
        display: flex;
        align-items: center;
        line-height: 1;
    }

    .btn-placeholder {
        visibility: hidden;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
    }

    .start {
        background: #4ca34f;
        color: white;
    }

    .stop {
        background: #dc2626;
        color: white;
    }

    .reset {
        background: #e5e7eb;
    }

    .win-controls button {
        flex: 1;
        padding: 14px;
        margin-top: 16px;
        font-size: 18px;
        border-radius: 12px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        border: none;
    }
    .win-controls button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .reset-all {
        background: #dc2626;
        color: white;
        width: 100%;
        margin-top: 16px;
        padding: 16px;
        font-size: 18px;
        border-radius: 12px;
    }

    .options-list {
        position: absolute;
        top: 100%;      
        background: white;
        border: 2px solid #ddd;
        border-radius: 12px;
        max-height: 200px;
        overflow-y: auto;
        width: 100%;
        z-index: 1000;
    }
    .options-list div {
        padding: 12px;
        cursor: pointer;
    }
    .options-list div:hover {
        background-color: #f0f0f0;
    }
    .hidden {
        display: none;
    }
</style>

<div class="container">
    <h1>Teams & Punktestände</h1>
    <div class="team">
        <div class="team-name-row" style="position: relative;">
            <input id="sportInput" 
                type="text" 
                placeholder="Sportart eingeben..." 
                oninput="updateSport()" 
                autocomplete="off">
            <div id="sportOptions" class="options-list hidden"></div>
        </div>
    </div>
    <!-- Team 1 -->
    <div class="team">
        <div class="team-name-row">
            <input id="team1Name" type="text" value="{{ team1.name }}" oninput="updateTeam(1)">
            <input id="team1Color" type="color" value="{{ '#%02x%02x%02x'|format(team1.color[0], team1.color[1], team1.color[2]) }}" onchange="updateTeam(1)">
        </div>

        <div class="score-row">
            <button class="minus" onclick="changeScore(1, -1)">−</button>
            <div class="score-display" id="team1Score">{{ team1.score }}</div>
            <button class="plus" onclick="changeScore(1, 1)">+</button>
        </div>
    </div>

    <!-- Team 2 -->
    <div class="team">
        <div class="team-name-row">
            <input id="team2Name" type="text" value="{{ team2.name }}" oninput="updateTeam(2)">
            <input id="team2Color" type="color" value="{{ '#%02x%02x%02x'|format(team2.color[0], team2.color[1], team2.color[2]) }}" onchange="updateTeam(2)">
        </div>

        <div class="score-row">
            <button class="minus" onclick="changeScore(2, -1)">−</button>
            <div class="score-display" id="team2Score">{{ team2.score }}</div>
            <button class="plus" onclick="changeScore(2, 1)">+</button>
        </div>
    </div>
    <div class="controls">
        <button id="gameToggle" class="start" onclick="toggleGameClock()">
            <span class="btn-text">▶ Start</span>
            <span class="btn-placeholder" aria-hidden="true">■ Stopp</span>
        </button>
        <button class="reset" onclick="resetGameClock()">↺ Reset</button>
    </div>
    <div class="controls win-controls">
        <button id="winTeam1" onclick="triggerWin(1)"></button>
        <button id="winTeam2" onclick="triggerWin(2)"></button>
    </div>
    <div class="controls">
        <button class="reset-all" onclick="resetAll()">🗑 Alles zurücksetzen</button>
    </div>
</div>

<script>
    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        return [
            (bigint >> 16) & 255,
            (bigint >> 8) & 255,
            bigint & 255
        ];
    }

    const scoreboard = {
        team1: {
            name: "{{ team1.name }}",
            score: parseInt("{{ team1.score }}"),
            color: "{{ '#%02x%02x%02x'|format(team1.color[0], team1.color[1], team1.color[2]) }}"
        },
        team2: {
            name: "{{ team2.name }}",
            score: parseInt("{{ team2.score }}"),
            color: "{{ '#%02x%02x%02x'|format(team2.color[0], team2.color[1], team2.color[2]) }}"
        }
    };

    function changeScore(team, delta) {
        const t = scoreboard["team" + team];
        t.score = Math.max(0, t.score + delta);
        document.getElementById("team" + team + "Score").textContent = t.score;
        sendToServer();
    }

    function updateTeam(team) {
        const t = scoreboard["team" + team];
        t.name = document.getElementById("team" + team + "Name").value;
        t.color = document.getElementById("team" + team + "Color").value;
        sendToServer();
        updateWinButtons();
    }

    function sendToServer() {
        fetch("/scoreboard/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mode: "scores_and_teams",
                sport: sportInput.value,
                teams: [
                    {
                        name: scoreboard.team1.name,
                        score: scoreboard.team1.score,
                        color: hexToRgb(scoreboard.team1.color)
                    },
                    {
                        name: scoreboard.team2.name,
                        score: scoreboard.team2.score,
                        color: hexToRgb(scoreboard.team2.color)
                    }
                ]
            })
        }).catch(() => {});

        // --- Check for winner and stop the game clock on frontend ---
        const sport = document.getElementById("sportInput").value.toLowerCase();
        const t1 = scoreboard.team1.score;
        const t2 = scoreboard.team2.score;
        let winner = false;

        // Volleyball win condition: 25 points with at least 2 point lead
        if (sport === "volleyball") {
            if ((t1 >= 25 && t1 - t2 >= 2) || (t2 >= 25 && t2 - t1 >= 2)) {
                winner = true;
            }
        }

        // Badminton win condition: 21 points + 2 point lead, max 30 points
        if (sport === "badminton") {
            if ((Math.max(t1, t2) >= 21 && Math.abs(t1 - t2) >= 2) || t1 === 30 || t2 === 30) {
                winner = true;
            }
        }

        // --- If a winner is detected, stop the game clock and update button UI ---
        if (winner) {
            // Stop server-side game clock
            fetch("/game_clock/stop", { method: "POST" }).catch(() => {});

            // Update start/stop button UI
            const btn = document.getElementById("gameToggle");
            const btnText = btn.querySelector(".btn-text");
            btnText.textContent = "▶ Start";
            btn.classList.remove("stop");
            btn.classList.add("start");
            gameRunning = false;
        }
    }

    let gameRunning = false;

    setInterval(() => {
        fetch("/get_state")
            .then(res => res.json())
            .then(state => {
                scoreboard.winner_locked = state.winner_locked || false;
                updateWinButtons();
            })
            .catch(() => {});
    }, 500);

    function toggleGameClock() {
        fetch("/game_clock/toggle", { method: "POST" }).catch(() => {});

        const btn = document.getElementById("gameToggle");
        const btnText = btn.querySelector(".btn-text");

        if (!gameRunning) {
            btnText.textContent = "■ Stopp";
            btn.classList.remove("start");
            btn.classList.add("stop");
            gameRunning = true;
        } else {
            btnText.textContent = "▶ Start";
            btn.classList.remove("stop");
            btn.classList.add("start");
            gameRunning = false;
        }
    }

    function resetGameClock() {
        fetch("/game_clock/reset", { method: "POST" }).catch(() => {});

        const btn = document.getElementById("gameToggle");
        const btnText = btn.querySelector(".btn-text");

        btnText.textContent = "▶ Start";
        btn.classList.remove("stop");
        btn.classList.add("start");
        gameRunning = false;
    }

    window.addEventListener("DOMContentLoaded", () => {
        fetch("/get_state")
            .then(res => res.json())
            .then(state => {
                gameRunning = state.game_clock_running || false;
                scoreboard.team1.name = state.teams[0].name;
                scoreboard.team2.name = state.teams[1].name;
                scoreboard.team1.score = state.teams[0].score;
                scoreboard.team2.score = state.teams[1].score;
                scoreboard.team1.color = document.getElementById("team1Color").value;
                scoreboard.team2.color = document.getElementById("team2Color").value;
                scoreboard.winner_locked = state.winner_locked || false;

                const btn = document.getElementById("gameToggle");
                const btnText = btn.querySelector(".btn-text");
                btnText.textContent = gameRunning ? "■ Stopp" : "▶ Start";
                btn.classList.toggle("stop", gameRunning);
                btn.classList.toggle("start", !gameRunning);

                document.getElementById("team1Name").value = scoreboard.team1.name;
                document.getElementById("team2Name").value = scoreboard.team2.name;
                document.getElementById("team1Score").textContent = scoreboard.team1.score;
                document.getElementById("team2Score").textContent = scoreboard.team2.score;

                updateWinButtons();
            });
    });

    // --- Sport Autocomplete ---
    const predefinedSports = ["Volleyball", "Badminton", "Basketball", "Fußball", "Fechten"];
    const sportInput = document.getElementById("sportInput");
    const sportOptions = document.getElementById("sportOptions");

    // Show suggestions on focus
    sportInput.addEventListener("focus", showOptions);
    // Hide suggestions after blur (longer delay to allow click)
    sportInput.addEventListener("blur", () => setTimeout(() => sportOptions.classList.add("hidden"), 250));

    function showOptions() {
        sportOptions.innerHTML = "";
        predefinedSports.forEach(sport => {
            const div = document.createElement("div");
            div.textContent = sport;
            div.addEventListener("click", () => selectSport(sport));
            sportOptions.appendChild(div);
        });
        sportOptions.classList.remove("hidden");
    }

    // When a suggestion is clicked
    function selectSport(sport) {
        sportInput.value = sport;
        sportOptions.classList.add("hidden");
        sendSportToServer(sport);
    }

    // When user types a custom sport
    function updateSport() {
        sportOptions.classList.add("hidden");
        sendSportToServer(sportInput.value);
    }

    // Send current sport to server
    function sendSportToServer(sport) {
        fetch("/scoreboard/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mode: "scores_and_teams",
                sport: sport,
                teams: [
                    {
                        name: scoreboard.team1.name,
                        score: scoreboard.team1.score,
                        color: hexToRgb(scoreboard.team1.color)
                    },
                    {
                        name: scoreboard.team2.name,
                        score: scoreboard.team2.score,
                        color: hexToRgb(scoreboard.team2.color)
                    }
                ]
            })
        }).catch(() => {});
    }

    // Load current sport from server on page load
    window.addEventListener("DOMContentLoaded", () => {
        fetch("/get_state")
            .then(res => res.json())
            .then(state => {
                if(state.sport) sportInput.value = state.sport;
            });
    });

    function triggerWin(team) {
        fetch("/scoreboard/trigger_winner", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team })
        })
        .then(res => res.json())
        .then(data => {
            fetch("/get_state")
                .then(res => res.json())
                .then(state => {
                    const btn = document.getElementById("gameToggle");
                    const btnText = btn.querySelector(".btn-text");
                    btnText.textContent = "▶ Start";
                    btn.classList.remove("stop");
                    btn.classList.add("start");
                    gameRunning = state.game_clock_running || false;

                    scoreboard.team1.score = state.teams[0].score;
                    scoreboard.team2.score = state.teams[1].score;
                    scoreboard.team1.name = state.teams[0].name;
                    scoreboard.team2.name = state.teams[1].name;

                    document.getElementById("team1Score").textContent = scoreboard.team1.score;
                    document.getElementById("team2Score").textContent = scoreboard.team2.score;
                    document.getElementById("team1Name").value = scoreboard.team1.name;
                    document.getElementById("team2Name").value = scoreboard.team2.name;

                    scoreboard.winner_locked = state.winner_locked || false;
                    updateWinButtons();
                });
        })
        .catch(() => {});
    }

    function updateWinButtons() {
        const btn1 = document.getElementById("winTeam1");
        const btn2 = document.getElementById("winTeam2");

        btn1.textContent = scoreboard.team1.name + " gewinnt";
        btn2.textContent = scoreboard.team2.name + " gewinnt";

        btn1.style.background = scoreboard.team1.color;
        btn2.style.background = scoreboard.team2.color;

        const disabled = scoreboard.winner_locked || false;
        btn1.disabled = disabled;
        btn2.disabled = disabled;
    }

    function resetAll() {
        if (!confirm("Willst du wirklich alles zurücksetzen?")) return;

        fetch("/scoreboard/reset_all", { method: "POST" })
            .then(() => {
                scoreboard.team1.name = "Team 1";
                scoreboard.team2.name = "Team 2";
                scoreboard.team1.score = 0;
                scoreboard.team2.score = 0;
                scoreboard.team1.color = "#0badfe";
                scoreboard.team2.color = "#d64c4c";

                document.getElementById("team1Name").value = "Team 1";
                document.getElementById("team2Name").value = "Team 2";
                document.getElementById("team1Score").textContent = "0";
                document.getElementById("team2Score").textContent = "0";
                document.getElementById("team1Color").value = "#0badfe";
                document.getElementById("team2Color").value = "#d64c4c";
                document.getElementById("sportInput").value = "";

                resetGameClock();
            })
            .catch(() => {});
    }
</script>
{% endblock %}
