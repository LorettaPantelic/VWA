{% extends "base.html" %}

{% block content %}

<style>
    .container {
        background: white;
        padding: 24px;
        border-radius: 16px;
        width: 520px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        margin-bottom: 16px;
        text-align: center;
    }

    .controls {
        display: flex;
        gap: 12px;
    }

    button {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        min-height: 52px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .start {
        background: #4ca34f;
        color: white;
    }

    .stop {
        background: #dc2626;
        color: white;
    }

    .reset {
        background: #e5e7eb;
    }
</style>

<div class="container">
    <h1>Buzzer Steuerung</h1>

    <!-- BUZZER 1 -->
    <h2>Buzzer 1</h2>
    <div class="controls">
        <button id="toggleBtn1" class="start" onclick="toggle(1)">
            Start (I)
        </button>
        <button class="reset" onclick="reset(1)">
            Reset (P)
        </button>
    </div>

    <hr style="margin:20px 0">

    <!-- BUZZER 2 -->
    <h2>Buzzer 2</h2>
    <div class="controls">
        <button id="toggleBtn2" class="start" onclick="toggle(2)">
            Start (J)
        </button>
        <button class="reset" onclick="reset(2)">
            Reset (L)
        </button>
    </div>
</div>

<script>
let running = { 1: false, 2: false };

async function toggle(id) {
    try {
        await fetch(`/buzzer/${id}/toggle`, { method: "POST" });

        // Fetch current buzzer state from server
        const stateResp = await fetch("/get_state");
        const state = await stateResp.json();

        const buzzerState = state[`buzzer${id}`] || {};
        const isRunning = buzzerState.running || false;

        running[id] = isRunning;
        const btn = document.getElementById(`toggleBtn${id}`);

        if (isRunning) {
            btn.classList.remove("start");
            btn.classList.add("stop");
            btn.textContent = id === 1 ? "Stopp (O)" : "Stopp (K)";
        } else {
            btn.classList.remove("stop");
            btn.classList.add("start");
            btn.textContent = id === 1 ? "Start (I)" : "Start (J)";
        }

    } catch (err) {
        console.error(err);
    }
}

async function reset(id) {
    try {
        const response = await fetch(`/buzzer/${id}/reset`, { method: "POST" });
        if (!response.ok) throw new Error("Fehler beim Reset");

        const btn = document.getElementById(`toggleBtn${id}`);
        running[id] = false;
        btn.classList.remove("stop");
        btn.classList.add("start");
        btn.textContent = id === 1 ? "Start (I)" : "Start (J)";
    } catch (err) {
        console.error(err);
    }
}

// --- Sync buzzer status on page load ---
async function syncBuzzerState() {
    try {
        const res = await fetch("/get_state");
        const state = await res.json();

        [1,2].forEach(id => {
            const buzzerState = state[`buzzer${id}`] || {};
            const isRunning = buzzerState.running || false;
            running[id] = isRunning;
            const btn = document.getElementById(`toggleBtn${id}`);

            if (isRunning) {
                btn.classList.remove("start");
                btn.classList.add("stop");
                btn.textContent = id === 1 ? "Stopp (O)" : "Stopp (K)";
            } else {
                btn.classList.remove("stop");
                btn.classList.add("start");
                btn.textContent = id === 1 ? "Start (I)" : "Start (J)";
            }
        });
    } catch (err) {
        console.error("Error syncing buzzer state:", err);
    }
}

// --- Poll server every 500ms to stay in sync ---
setInterval(syncBuzzerState, 500);

// Run sync once on page load
window.addEventListener("DOMContentLoaded", syncBuzzerState);
</script>

{% endblock %}
