{% extends "base.html" %}

{% block content %}

<style>
    .container {
        background: white;
        padding: 24px;
        border-radius: 16px;
        width: 420px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        margin-bottom: 16px;
        text-align: center;
    }

    .controls {
        display: flex;
        gap: 12px;
    }

    button {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        min-height: 52px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .start {
        background: #4ca34f;
        color: white;
    }

    .stop {
        background: #dc2626;
        color: white;
    }

    .reset {
        background: #e5e7eb;
    }
</style>

<div class="container">
    <h1>Buzzer Steuerung</h1>

    <!-- BUZZER 1 -->
    <h2>Buzzer 1</h2>
    <div class="controls">
        <button id="toggleBtn1" class="start" onclick="toggle(1)">
            Start (I)
        </button>
        <button class="reset" onclick="reset(1)">
            Reset (P)
        </button>
    </div>

    <hr style="margin:20px 0">

    <!-- BUZZER 2 -->
    <h2>Buzzer 2</h2>
    <div class="controls">
        <button id="toggleBtn2" class="start" onclick="toggle(2)">
            Start (J)
        </button>
        <button class="reset" onclick="reset(2)">
            Reset (L)
        </button>
    </div>
</div>

<script>
let running = {
    1: false,
    2: false
};

function toggle(id) {
    fetch(`/buzzer/${id}/toggle`, { method: "POST" });

    running[id] = !running[id];
    const btn = document.getElementById(`toggleBtn${id}`);

    if (running[id]) {
        btn.classList.remove("start");
        btn.classList.add("stop");
        btn.textContent = id === 1 ? "Stopp (O)" : "Stopp (K)";
    } else {
        btn.classList.remove("stop");
        btn.classList.add("start");
        btn.textContent = id === 1 ? "Start (I)" : "Start (J)";
    }
}

function reset(id) {
    fetch(`/buzzer/${id}/reset`, { method: "POST" });

    running[id] = false;
    const btn = document.getElementById(`toggleBtn${id}`);
    btn.classList.remove("stop");
    btn.classList.add("start");
    btn.textContent = id === 1 ? "Start (I)" : "Start (J)";
}
</script>

{% endblock %}
